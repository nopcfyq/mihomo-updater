# =====================================================================
# 放到你 fork 的 mihomo-updater 仓库: .github/workflows/build-images.yml
# 用法: Actions -> Build updater images -> Run workflow -> 选平台
# 产物: Artifacts 里下载 tar.gz -> NAS: docker load -i xxx.tar.gz
# =====================================================================
name: Build updater images

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: linux/arm64
        type: choice
        options:
          - linux/arm64
          - linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize platform tag (for artifact name)
        id: plat
        run: echo "tag=$(echo "${{ inputs.platform }}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.image }})
        run: |
          docker buildx build \
            --platform "${{ inputs.platform }}" \
            --file build/docker/${{ matrix.image }}/Dockerfile \
            --tag mihomo-updater-${{ matrix.image }}:latest \
            --output type=docker,dest=mihomo-updater-${{ matrix.image }}.tar \
            .

      - name: Compress
        run: gzip -f mihomo-updater-${{ matrix.image }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-updater-${{ matrix.image }}-${{ steps.plat.outputs.tag }}
          path: mihomo-updater-${{ matrix.image }}.tar.gz
